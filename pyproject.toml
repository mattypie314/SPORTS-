[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sportsbot"
version = "0.1.0"
description = "Kalshi sports betting bot — live board, signals, paper trading"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Matt Kubit" }]
dependencies = [
    "cryptography>=43.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
sportsbot = "sportsbot.cli:main"

[tool.setuptools.packages.find]
include = ["sportsbot*"]

[tool.setuptools.package-data]
sportsbot = ["dashboard/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
